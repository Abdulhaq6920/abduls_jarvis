[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.2.0"
description = "JARVIS orchestration backend: supervisor, agents, auth, memory, policy, scheduler."
requires-python = ">=3.10"
dependencies = [
    "jarvis-shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "PyJWT>=2.8",
    # TOTP MFA. The runtime uses a stdlib RFC-6238 implementation (auth/totp.py) and
    # never imports pyotp; this is the documented/intended dependency only.
    "pyotp>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
# Schema migrations / ops path only. The async runtime never imports these: `migrate`
# imports alembic lazily and degrades to create_schema + an additive column backfill when
# it is absent (so the dev/test env needs neither). psycopg2-binary is the SYNC Postgres
# driver alembic uses for migrations; the app itself keeps using asyncpg.
migrations = ["alembic>=1.13", "psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.21", "ruff>=0.5", "pgserver"]

[project.scripts]
jarvis-backend = "jarvis_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_backend = ["web/**/*"]
