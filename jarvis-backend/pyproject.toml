[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.2.0"
description = "JARVIS orchestration backend: supervisor, agents, auth, memory, policy, scheduler."
requires-python = ">=3.10"
dependencies = [
    "jarvis-shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "redis>=5.0",
    "apscheduler>=3.10,<4",
    "prometheus-client>=0.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.21", "ruff>=0.5", "pgserver"]

[project.scripts]
jarvis-backend = "jarvis_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_backend = ["web/**/*"]
