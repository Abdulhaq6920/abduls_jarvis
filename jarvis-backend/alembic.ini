# Alembic configuration for jarvis-backend.
#
# This file is intentionally minimal: the database URL is NOT set here. `env.py` derives it
# at runtime from `Settings.effective_database_url` (converted to a sync driver), so secrets
# never live in a committed file and the migration path always targets the SAME database the
# application resolves. The `migrate` command locates this file via the installed package, so
# migrations do not depend on the current working directory.
[alembic]
script_location = migrations
# Keep migration filenames sortable and human-readable: <slug>_<message>.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
