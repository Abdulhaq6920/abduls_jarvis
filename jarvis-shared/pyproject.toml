[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-shared"
version = "0.1.0"
description = "Shared contracts and domain models for the JARVIS runtime."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
