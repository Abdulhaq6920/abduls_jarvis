# nginx in front of the JARVIS API replicas.
#   * load-balances across all `api` replicas (Docker DNS returns every replica)
#   * upgrades WebSockets
#   * blocks /metrics and API docs from the outside (Prometheus scrapes the api directly on the
#     internal network instead)
#   * sets X-Forwarded-For to the REAL client address (the backend trusts exactly one hop)
#   * applies coarse rate limits as a first line of defence, before requests reach Python

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;                                  # do not advertise the nginx version
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Re-resolve the api service so scaling up/down is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=creds:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # Slow-client / oversized-request hardening.
  client_max_body_size   64k;
  client_body_timeout    10s;
  client_header_timeout  10s;
  keepalive_timeout      30s;
  send_timeout           30s;

  server {
    listen 8080;
    server_name _;

    limit_conn conn 40;
    limit_req  zone=perip burst=40 nodelay;
    limit_req_status 429;

    # Never expose internals through the public proxy.
    location = /metrics                    { return 404; }
    location ~ ^/api/(docs|openapi\.json)$ { return 404; }

    # Credential endpoints: a much stricter per-IP limit than the rest of the API. (The
    # backend ALSO limits per account, so this is a second, cheaper layer, not the only one.)
    location ~ ^/api/auth/(login|device-token)$ {
      limit_req zone=creds burst=5 nodelay;
      set $upstream http://api:8077;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      set $upstream http://api:8077;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
      proxy_read_timeout 3600s;
    }

    location / {
      set $upstream http://api:8077;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503;  # retry another replica on failure
    }
  }
}
